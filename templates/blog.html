{% extends "base.html" %} {% block content %}
<h1 class="title">{{ section.title }}</h1>
<ul class="post-list">
  {% for page in section.pages %}
  <li class="post-list-item">
    <img class="pli-image" src="{{ get_url(path=page.extra.thumbnail) }}" />
    <div class="pli-content">
      <a class="pli-link" href="{{ page.permalink | safe }}">
        <h3 class="pli-title">{{ page.title }}</h3>
      </a>
      <em class="pli-date">Posted on {{ page.date }}</em>

      <p class="pli-description">{{ page.description }}</p>
    </div>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
